name: "Bug report"
description: "Report a bug or unexpected behavior."
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, application version, dependencies, etc.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Screenshots, logs, or other useful information.
    validations:
      required: false
